AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::Serverless-2016-10-31
Description: Fingerprint Pro Lambda@Edge function for CloudFront integration
Parameters:
  DistributionId:
    Description: CloudFront distribution ID. Leave it empty to create a new distribution
    Default: ""
    Type: String
  FpjsGetResultPath:
    AllowedPattern: ^$|^([a-zA-Z0-9\-])+$
    Description: (Optional) request path used to send V3 identification requests (aka FPJS_GET_RESULT_PATH)
    Default: ""
    Type: String
  FpjsAgentDownloadPath:
    AllowedPattern: ^$|^([a-zA-Z0-9\-])+$
    Description: (Optional) request path used to send V3 ProCDN requests (aka FPJS_AGENT_DOWNLOAD_PATH)
    Default: ""
    Type: String
  FpjsPreSharedSecret:
    AllowedPattern: ^([a-zA-Z0-9\-])+$
    Description: shared secret created on the Fingerprint dashboard (aka FPJS_PRE_SHARED_SECRET)
    Type: String
    NoEcho: true
  DomainNames:
    Description: (Optional) Domain names to attach to CloudFront distribution. Several domains names should be separated by plus sign (domain1.com+domain2.com)
    Default: ""
    Type: String
  ACMCertificateARN:
    Description: (Optional) ARN of SSL certificate in AWS Certificate Manager (the certificate could be requested in the AWS Certificate Manager or uploaded from the third-party service to AWS).
    Default: ""
    Type: String

Conditions:
  CreateCloudFrontDistribution:
    !Equals [!Ref DistributionId, ""]
  HasGetResultPath: !Not [!Equals [!Ref FpjsGetResultPath, ""]]
  HasAgentDownloadPath: !Not [!Equals [!Ref FpjsAgentDownloadPath, ""]]
  AttachDomainToCloudFront: !And
    - !Not [!Equals [!Ref DomainNames, ""]]
    - !Not [!Equals [!Ref ACMCertificateARN, ""]]

Resources:
  ## Lambda@Edge function for Fingerprint Pro integration

  ## Integration settings in SSM Parameter Store.
  ## All settings live under /fingerprint-pro-cloudfront-integration/<id>/ and are read with a single
  ## GetParametersByPath call. Paths are plain String parameters, the pre-shared secret is a SecureString.

  FpjsGetResultPathParameter:
    Type: AWS::SSM::Parameter
    Condition: HasGetResultPath
    Properties:
      Description: Fingerprint integration request path used to send V3 identification requests
      Type: String
      Name: !Join ['', ['/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]], '/fpjs_get_result_path']]
      Value: !Ref FpjsGetResultPath

  FpjsAgentDownloadPathParameter:
    Type: AWS::SSM::Parameter
    Condition: HasAgentDownloadPath
    Properties:
      Description: Fingerprint integration request path used to send V3 ProCDN requests
      Type: String
      Name: !Join ['', ['/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]], '/fpjs_agent_download_path']]
      Value: !Ref FpjsAgentDownloadPath

  # CloudFormation can't create SecureString parameters natively, so a small custom resource does it.
  FpjsPreSharedSecretParameter:
    Type: Custom::SecureStringParameter
    Properties:
      ServiceToken: !GetAtt SecureStringParameterFunction.Arn
      Name: !Join ['', ['/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]], '/fpjs_pre_shared_secret']]
      Value: !Ref FpjsPreSharedSecret

  SecureStringParameterFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role for the custom resource that manages SecureString parameters
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service:
              - lambda.amazonaws.com
      Policies:
      - PolicyName: ManageSecureStringParameters
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:DeleteParameter
            Resource:
              - !Join ['', [!Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]], '/*']]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SecureStringParameterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Creates, updates and deletes SecureString parameters for the Fingerprint integration
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt SecureStringParameterFunctionRole.Arn
      Code:
        ZipFile: |
          const { SSMClient, PutParameterCommand, GetParameterCommand, DeleteParameterCommand } = require('@aws-sdk/client-ssm')
          const { randomBytes } = require('node:crypto')
          const ssm = new SSMClient({})

          async function respond(event, status, physicalId, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || 'See CloudWatch logs',
              PhysicalResourceId: physicalId,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
            })
            await fetch(event.ResponseURL, { method: 'PUT', body, headers: { 'content-type': '' } })
          }

          async function exists(name) {
            try {
              await ssm.send(new GetParameterCommand({ Name: name }))
              return true
            } catch (e) {
              if (e.name === 'ParameterNotFound') return false
              throw e
            }
          }

          exports.handler = async (event) => {
            const { Name, Value, Generate } = event.ResourceProperties
            const physicalId = event.RequestType === 'Delete' ? event.PhysicalResourceId : Name
            try {
              if (event.RequestType === 'Delete') {
                await ssm.send(new DeleteParameterCommand({ Name: physicalId })).catch((e) => {
                  if (e.name !== 'ParameterNotFound') throw e
                })
              } else if (Generate === 'true') {
                // Keep an already generated value on stack updates.
                if (!(await exists(Name))) {
                  const value = randomBytes(15).toString('hex')
                  await ssm.send(new PutParameterCommand({ Name, Type: 'SecureString', Value: value }))
                }
              } else {
                await ssm.send(new PutParameterCommand({ Name, Type: 'SecureString', Value, Overwrite: true }))
              }
              await respond(event, 'SUCCESS', physicalId)
            } catch (e) {
              console.error(e)
              await respond(event, 'FAILED', physicalId || event.LogicalResourceId, String(e))
            }
          }

  FpIntLambdaFunctionExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      SamResourceId: FpIntLambdaFunctionExecutionRole
    Properties:
      Description: Lambda@Edge function execution role
      RoleName: !Join ['-', ['fingerprint-pro-lambda-role', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service:
              - lambda.amazonaws.com
              - edgelambda.amazonaws.com
      Policies:
      - PolicyName: ParameterStoreAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - ssm:GetParametersByPath
            Resource:
              # Lambda@Edge always reads settings from us-east-1, where the stack is deployed.
              - !Join ['', [!Sub 'arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
          # The mgmt token lives in a sub-path (<path>/mgmt/token); the proxy must not read it.
          - Effect: Deny
            Action:
              - ssm:GetParametersByPath
            Resource: '*'
            Condition:
              StringEquals:
                ssm:Recursive: 'true'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FingerprintProCloudFrontLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - FpIntLambdaFunctionExecutionRole
    Properties:
      Description: Lambda@Edge function definition
      FunctionName: !Join ['-', ['fingerprint-pro-cloudfront-lambda', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
      Handler: fingerprintjs-pro-cloudfront-lambda-function.handler
      Runtime: nodejs24.x
      CodeUri: s3://fingerprint-pro-cloudfront-integration/v2/lambda_latest.zip
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt FpIntLambdaFunctionExecutionRole.Arn

  FingerprintProCloudFrontLambdaVersion:
    Type: AWS::Lambda::Version
    DependsOn:
      - FingerprintProCloudFrontLambda
    Properties:
      FunctionName: !Ref FingerprintProCloudFrontLambda
      Description: Lambda@Edge function definition

  ## CloudFront distribution and related settings

  FingerprintProCDNCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Join [ '-', ['FingerprintProCDNCachePolicy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
        MinTTL: 0
        MaxTTL: 180
        DefaultTTL: 180
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - version
              - loaderVersion
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFrontDistribution
    Properties:
      DistributionConfig:
        Aliases:
          !If
          - AttachDomainToCloudFront
          - !Split ['+', !Ref DomainNames]
          - !Ref AWS::NoValue
        ViewerCertificate:
          !If
          - AttachDomainToCloudFront
          - AcmCertificateArn: !Ref ACMCertificateARN
            MinimumProtocolVersion: TLSv1.2_2018
            SslSupportMethod: sni-only
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          AllowedMethods:
              - HEAD
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
          CachePolicyId: !Ref FingerprintProCDNCachePolicy
          Compress: true
          LambdaFunctionAssociations:
            - EventType: origin-request
              IncludeBody: true
              LambdaFunctionARN: !Ref FingerprintProCloudFrontLambdaVersion
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Default AllViewer policy
          SmoothStreaming: false
          TargetOriginId: fpcdn.io
          ViewerProtocolPolicy: https-only
        Enabled: true
        Origins:
          - Id: fpcdn.io
            DomainName: fpcdn.io
            OriginCustomHeaders:
              - HeaderName: FPJS_PARAMETER_PATH
                HeaderValue: !Join ['', ['/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
              - HeaderName: FPJS_INTEGRATION_PATH_DEPTH
                HeaderValue: '0'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100

  ## Management Lambda function (responsible for switching CloudFront distribution to the new Fingerprint Pro Lambda@Edge version)

  FpMgmtLambdaFunctionExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      SamResourceId: FpMgmtLambdaFunctionExecutionRole
    Properties:
      Description: Management Lambda execution role
      RoleName: !Join ['-', ['fingerprint-pro-lambda-mgmt-role', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service:
              - lambda.amazonaws.com
      Policies:
      - PolicyName: ParameterStoreAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Join ['', [!Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]], '/mgmt/token']]
      - PolicyName: S3LambdaDistributionAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: arn:aws:s3:::fingerprint-pro-cloudfront-integration/v2/lambda_latest.zip
      - PolicyName: FpLambdaUpdate
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - lambda:ListVersionsByFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:EnableReplication
              - lambda:UpdateFunctionCode
              - lambda:PublishVersion
            Resource:
              - !Join
                  - ''
                  - - !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:'
                    - 'fingerprint-pro-cloudfront-lambda-'
                    - !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
                    - ':*'
              - !Join
                  - ''
                  - - !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:'
                    - 'fingerprint-pro-cloudfront-lambda-'
                    - !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      - PolicyName: CloudFrontUpdate
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - cloudfront:GetDistribution
              - cloudfront:UpdateDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:CreateInvalidation
            Resource: !Join ['', [!Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/', !If [CreateCloudFrontDistribution, !Ref CloudFrontDistribution, !Ref DistributionId]]]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  MgmtTokenParameter:
    Type: Custom::SecureStringParameter
    Properties:
      ServiceToken: !GetAtt SecureStringParameterFunction.Arn
      Name: !Join ['', ['/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]], '/mgmt/token']]
      Generate: 'true'

  FingerprintProMgmtLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - FpMgmtLambdaFunctionExecutionRole
      - MgmtTokenParameter
    Properties:
      FunctionName: !Join ['-', ['fingerprint-pro-mgmt-lambda', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
      Handler: fingerprintjs-pro-cloudfront-mgmt-lambda-function.handler
      Runtime: nodejs24.x
      CodeUri: s3://fingerprint-pro-cloudfront-integration/v2/mgmt_lambda_latest.zip
      MemorySize: 128
      Timeout: 120
      Role: !GetAtt FpMgmtLambdaFunctionExecutionRole.Arn
      Environment:
        Variables:
          SettingsParameterName: !Ref MgmtTokenParameter
          LambdaFunctionName: !Ref FingerprintProCloudFrontLambda
          LambdaFunctionArn: !GetAtt FingerprintProCloudFrontLambda.Arn
          CFDistributionId: !If [CreateCloudFrontDistribution, !Ref CloudFrontDistribution, !Ref DistributionId]

  MgmtFunctionURL:
    Type: AWS::Lambda::Url
    DependsOn:
      - FingerprintProMgmtLambda
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt FingerprintProMgmtLambda.Arn

  MgmtFunctionInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - FingerprintProMgmtLambda
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref FingerprintProMgmtLambda
      FunctionUrlAuthType: NONE
      Principal: "*"
  
  MgmtFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - FingerprintProMgmtLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FingerprintProMgmtLambda
      Principal: "*"

Outputs:
  LambdaFunctionName:
    Description: Fingerprint Pro Lambda function name
    Value:
      Ref: FingerprintProCloudFrontLambda
    Export:
      Name: !Join ['-', ['fingerprint-pro-cloudfront-lambda', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  LambdaFunctionVersion:
    Description: Fingerprint Pro Lambda function version
    Value:
      Ref: FingerprintProCloudFrontLambdaVersion
    Export:
      Name: !Join ['-', ['fingerprint-pro-cloudfront-lambda-version', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  CachePolicyName:
    Description: Cache policy name
    Value:
      Ref: FingerprintProCDNCachePolicy
    Export:
      Name: !Join [ '-', ['FingerprintProCDNCachePolicy', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  CloudFrontDistributionId:
    Description: CloudFront distribution Id used in the integration settings
    Value:
      Fn::If: [CreateCloudFrontDistribution, !Ref CloudFrontDistribution, !Ref DistributionId]
    Export:
      Name: !Join ['-', ['fingerprint-pro-cloudfront-distribution', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  IsCloudFrontDistributionCreatedByDeployment:
    Description: Indicate if the CloudFront distribution with attached Lambda function was created by deployment or not (depends on initial parameters)
    Value:
      Fn::If: [CreateCloudFrontDistribution, "true", "false"]
    Export:
      Name: !Join ['-', ['is-cloudfront-distribution-created-by-deployment', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  FingerprintProMgmtLambda:
    Description: Fingerprint Pro Lambda management function name
    Value:
      Ref: FingerprintProMgmtLambda
    Export:
      Name: !Join ['-', ['fingerprint-pro-mgmt-lambda', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  MgmtLambdaFunctionUrl:
    Description: Fingerprint Pro management Lambda function's public URL
    Value:
      Fn::GetAtt: MgmtFunctionURL.FunctionUrl
    Export:
      Name: !Join ['-', ['fingerprint-pro-mgmt-lambda-url', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  FingerprintIntegrationSettingsParameterPath:
    Description: Parameter Store path holding the Fingerprint Pro CloudFront integration settings
    Value: !Join ['', ['/fingerprint-pro-cloudfront-integration/', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
    Export:
      Name: !Join ['-', ['fingerprint-pro-cloudfront-integration-settings-path', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
  MgmtTokenParameter:
    Description: Parameter Store SecureString holding the Fingerprint Pro Management Lambda token
    Value:
      Ref: MgmtTokenParameter
    Export:
      Name: !Join ['-', ['fingerprint-pro-mgmt-token-parameter', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]]
