name: Run mgmt-lambda upgrade E2E test on USE1 - DEV
on:
  pull_request:
    paths:
      - 'mgmt-lambda/**'
      - 'cloudformation/**'
      - 'e2e/scripts/mgmtLambdaE2E*.ts'
      - '.github/workflows/mgmt-lambda-e2e.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
env:
  # Lambda@Edge and mgmt-lambda both require us-east-1
  AWS_REGION: us-east-1
  STACK_NAME: fingerprint-mgmt-lambda-e2e
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
concurrency:
  # All runs share one stack; never cancel a run mid-mutation
  group: mgmt-lambda-e2e
  cancel-in-progress: false
jobs:
  mgmt-lambda-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials from dev account
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::708050157146:role/github_eb_ci_cd
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install

      - name: Build PR mgmt-lambda package
        run: pnpm build && pnpm prepare-package

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "FpjsPreSharedSecret=$FPJS_PRE_SHARED_SECRET" \
            --no-fail-on-empty-changeset
        env:
          FPJS_PRE_SHARED_SECRET: ${{ secrets.PROXY_SECRET }}

      - name: Run mgmt-lambda E2E test
        run: pnpm test:mgmt-e2e
        env:
          EXISTING_STACK_NAME: ${{ env.STACK_NAME }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Print diagnostics
        if: failure()
        run: |
          MGMT_FUNCTION=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FingerprintProMgmtLambda'].OutputValue" --output text || true)
          if [ -n "$MGMT_FUNCTION" ] && [ "$MGMT_FUNCTION" != "None" ]; then
            aws logs tail "/aws/lambda/$MGMT_FUNCTION" --since 30m || true
          fi
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --max-items 20 \
            --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" --output table || true
